name: Build dashboard

on:
  # Every 15 minutes, off the quarter-hour: scheduled jobs on the hour and the
  # quarter queue behind everyone else's. Pages caches HTML for 10 minutes, so
  # building faster than this would not make the page any fresher. GitHub
  # runs schedules best effort: expect many of these to be late or dropped.
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Read the repositories, publish the page, and mint the OIDC token Pages
# deployment needs. Nothing here writes to a repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled deploy
# leaves the site on whatever was there before, which for a status board means
# silently serving stale results.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # build.py is the whole tool, and nothing checked it: ruff ran only when
  # somebody remembered to run it. Against current ruff with preview rules,
  # because that is the strictest thing likely to look at this file, and a new
  # rule failing here is cheaper to find than a broken build.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
    - run: uvx ruff check --preview .
    - run: uvx ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # GITHUB_TOKEN is enough to read public repositories. Set a DASHBOARD_TOKEN
    # secret (a fine-grained PAT, read-only) only if you ever want private ones
    # on the board -- and note that Pages is public, so their names would be too.
    # Two steps, because they fail for different reasons: collect fails when
    # the API does, render fails when this repository's own code does. The
    # step name says which without reading the log.
    - name: Collect
      env:
        GITHUB_TOKEN: ${{ secrets.DASHBOARD_TOKEN || secrets.GITHUB_TOKEN }}
      run: python3 build.py collect --owner charlieh0tel --out-dir _site

    - name: Render
      run: python3 build.py render --out-dir _site

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - id: deploy
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
