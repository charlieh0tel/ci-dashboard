name: Pull request

# Everything build.yml does short of deploying, so a change is exercised
# before the run that publishes it. No `paths:` filter: a check that is
# skipped never reports, and a required check that never reports blocks the
# merge.
on:
  pull_request:

# Reading is all any of this needs, and all a Dependabot or fork pull request
# is given anyway. No secrets either, for the same reason.
permissions:
  contents: read

# Its own group, not `pages`: a pull request must never queue behind a
# deployment or hold one up. A newer push makes the older run pointless.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Job names are not shared with build.yml, so each one is unambiguous as a
# required status check.
jobs:
  # The same two commands as the lint job in build.yml.
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
    - run: uvx ruff check --preview .
    - run: uvx ruff format --check .

  # A workflow typo in build.yml otherwise shows up as a board that stopped
  # updating. The release binary is fetched at a fixed version and checked
  # against a fixed digest rather than installed by the project's download
  # script, which would be a remote script piped into a shell.
  actionlint:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.7.12
      SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install actionlint
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="actionlint_${VERSION}_linux_amd64.tar.gz"
        gh release download "v${VERSION}" --repo rhysd/actionlint \
          --pattern "$archive" --dir "$RUNNER_TEMP"
        echo "${SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP" actionlint
    - run: '"$RUNNER_TEMP/actionlint" -color'

  # The render half against a committed status.json: no network, no token,
  # and the same answer every time.
  render-fixture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - run: python3 -m unittest discover -s tests -v

  # Both halves against the live API, into a scratch directory that nothing
  # uploads. Four repositories rather than the whole account: the Actions
  # token's 1,000 requests an hour are shared with the build that deploys, a
  # full crawl is about 100 of them, and these four cover each lockfile type,
  # a release, a tag-only publisher, crates.io, npm and the APT repository
  # in 14.
  collect-and-render:
    runs-on: ubuntu-latest
    env:
      REPOS: >-
        charlieh0tel/ci-dashboard
        charlieh0tel/nec2-js
        charlieh0tel/rotaryclub
        charlieh0tel/usbrelay-rs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # 14 requests today: one GraphQL query, two pages of runs for each of
    # the four at most, the APT map and the four an npm workspace costs. The
    # ceiling leaves room for a repository gaining a second page of runs, and
    # none for a change that goes back to asking per file or per pull request.
    - name: Collect
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        read -r -a names <<< "$REPOS"
        python3 build.py collect --owner charlieh0tel \
          --out-dir "$RUNNER_TEMP/site" "${names[@]/#/--repo=}" \
          --max-requests 25

    - name: Render
      run: python3 build.py render --out-dir "$RUNNER_TEMP/site"

    # collect exits 0 whatever it was refused: a repository it could not read
    # still gets a row, marked unchecked, and one that does not exist gets
    # none. Either is a failure here. All four have workflow runs and so earn
    # a row; one going missing means it was renamed or archived, and the list
    # above no longer covers what it claims to.
    - name: Check that all four were read and made it onto the page
      run: |
        status="$RUNNER_TEMP/site/status.json"
        page="$RUNNER_TEMP/site/index.html"
        read -r -a names <<< "$REPOS"
        bad=0
        for repo in "${names[@]}"; do
          state=$(jq -r --arg name "$repo" '
            [.repos[] | select(.name == $name)]
            | if length == 0 then "not in status.json"
              elif .[0].unchecked then "could not be checked: " + .[0].unchecked
              else "ok" end' "$status")
          if [ "$state" != ok ]; then
            echo "::error::${repo} ${state}"
            bad=1
          fi
          if ! grep -q "href='https://github.com/${repo}'" "$page"; then
            echo "::error::${repo} is not on the page"
            bad=1
          fi
        done
        if ! jq -e '.unchecked == []' "$status" > /dev/null; then
          echo "::error::could not read: $(jq -c '.unchecked' "$status")"
          bad=1
        fi
        grep -q "</html>" "$page"
        exit "$bad"
